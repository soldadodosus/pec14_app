name: Compilar e Organizar Flutter

# 1. Quando essa automação vai rodar?
# Neste caso, toda vez que você fizer um push na branch "main"
on:
  push:
    branches:
      - main

# 2. O que ela vai fazer?
jobs:
  build-android:
    name: Build Android (APK & AAB)
    # Usa um servidor Linux do GitHub (gratuito e rápido)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER_OFFSET: 16

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar o Flutter no servidor
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Instalar dependências
        run: flutter pub get

      - name: 🔢 Definir número de build
        run: |
          APP_VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Não foi possível ler a versão do pubspec.yaml."
            exit 1
          fi
          BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "RELEASE_TAG=v${APP_VERSION}-build${BUILD_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: 🤖 Construir APK
        run: flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: 🤖 Construir AAB (App Bundle)
        run: flutter build appbundle --release --build-number "$BUILD_NUMBER"

      # Aqui está a mágica! O servidor roda o script que criamos
      - name: 🔄 Executar script de renomeação
        run: dart run rename_builds.dart --build-number "$BUILD_NUMBER"

      - name: ☁️ Salvar arquivos gerados (Upload)
        uses: actions/upload-artifact@v4
        with:
          name: Meus-Apps-Renomeados
          # Pega a pasta inteira que o nosso script gerou
          path: releases_finais/

      - name: 🏷️ Criar tag Git antes da Release
        run: |
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "A tag $RELEASE_TAG já existe em outro commit."
              exit 1
            fi
            echo "A tag $RELEASE_TAG já aponta para este commit."
          else
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: 🚀 Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              releases_finais/*.apk \
              releases_finais/*.aab \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "App PEC 14 $RELEASE_TAG" \
              --generate-notes \
              releases_finais/*.apk \
              releases_finais/*.aab
          fi